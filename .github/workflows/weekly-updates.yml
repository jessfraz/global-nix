name: Dependency Updates

on:
  schedule:
    # Every third day of the month at 17:17 UTC; resets on the first.
    - cron: "17 17 */3 * *"
  workflow_dispatch:

concurrency:
  group: weekly-dependency-updates
  cancel-in-progress: false

permissions:
  contents: read

env:
  UPDATE_BRANCH: automation/weekly-updates
  UPDATE_TITLE: "chore: dependency updates"
  UPDATE_BOT: jessfraz-global-nix-updater[bot]

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Configure public build cache
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: jessfraz-global-nix
          skipPush: true

      - name: Update pins and flake inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            nix shell nixpkgs#just --command just update-pins
            nix flake update --option warn-dirty false
          } 2>&1 | tee "${RUNNER_TEMP}/update-output.txt"

      # Installation tokens expire after an hour; mint after the long refresh.
      - name: Create dependency updater token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.DEPENDENCY_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPENDENCY_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Commit generated updates
        id: commit
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          bot_id="$(gh api "users/${UPDATE_BOT}" --jq '.id')"
          git config user.name "${UPDATE_BOT}"
          git config user.email "${bot_id}+${UPDATE_BOT}@users.noreply.github.com"
          git switch -c "${UPDATE_BRANCH}"
          git add --all

          if git diff --cached --quiet; then
            echo "has_changes=false" >> "${GITHUB_OUTPUT}"
            echo "## Dependency updates" >> "${GITHUB_STEP_SUMMARY}"
            echo "Everything is already current." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          git commit -m "${UPDATE_TITLE}"
          echo "has_changes=true" >> "${GITHUB_OUTPUT}"

      - name: Push update branch
        if: steps.commit.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh auth setup-git
          remote_sha="$(git ls-remote origin "refs/heads/${UPDATE_BRANCH}" | cut -f1)"
          if [[ -n "${remote_sha}" ]]; then
            git push \
              --force-with-lease="refs/heads/${UPDATE_BRANCH}:${remote_sha}" \
              origin "HEAD:refs/heads/${UPDATE_BRANCH}"
          else
            git push origin "HEAD:refs/heads/${UPDATE_BRANCH}"
          fi

      - name: Open or refresh update pull request
        if: steps.commit.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          owner="${GH_REPO%%/*}"
          pulls="$(gh api --method GET "repos/${GH_REPO}/pulls" \
            -f state=open \
            -f base=main \
            -f "head=${owner}:${UPDATE_BRANCH}")"
          count="$(jq 'length' <<< "${pulls}")"
          if [[ "${count}" -gt 1 ]]; then
            echo "Expected at most one open dependency update PR, found ${count}." >&2
            exit 1
          fi

          body="${RUNNER_TEMP}/weekly-update-body.md"
          {
            echo "Automated dependency refresh, scheduled every three days."
            echo
            echo "This PR updates the repository pins and all flake inputs, then merges only after the existing **Test Nix Flake** workflow succeeds. It never deploys a host."
            echo
            echo "### Updater output"
            echo
            echo '```text'
            cat "${RUNNER_TEMP}/update-output.txt"
            echo '```'
            echo
            echo "### Changed files"
            echo
            echo '```text'
            git diff --stat origin/main...HEAD
            echo '```'
          } > "${body}"

          if [[ "${count}" -eq 1 ]]; then
            pr_number="$(jq -r '.[0].number' <<< "${pulls}")"
            pr_author="$(jq -r '.[0].user.login' <<< "${pulls}")"
            if [[ "${pr_author}" != "${UPDATE_BOT}" ]]; then
              echo "Refusing to update PR #${pr_number}, owned by ${pr_author}." >&2
              exit 1
            fi
            gh pr edit "${pr_number}" --title "${UPDATE_TITLE}" --body-file "${body}"
          else
            gh pr create \
              --base main \
              --head "${UPDATE_BRANCH}" \
              --title "${UPDATE_TITLE}" \
              --body-file "${body}"
          fi

          {
            echo "## Dependency updates"
            echo "Opened or refreshed the automated update PR for **Test Nix Flake** pull request CI."
            echo "No host deployment was attempted."
          } >> "${GITHUB_STEP_SUMMARY}"
