name: Merge Dependency Updates

on:
  workflow_call:

concurrency:
  group: merge-weekly-dependency-updates
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Validate and merge the tested update
        id: merge
        env:
          EXPECTED_BRANCH: automation/weekly-updates
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          owner="${GH_REPO%%/*}"
          pulls="$(gh api --method GET "repos/${GH_REPO}/pulls" \
            -f state=open \
            -f base=main \
            -f "head=${owner}:${EXPECTED_BRANCH}")"

          count="$(jq 'length' <<< "${pulls}")"
          if [[ "${count}" -ne 1 ]]; then
            echo "Expected exactly one open dependency update PR, found ${count}." >&2
            exit 1
          fi

          pr_number="$(jq -r '.[0].number' <<< "${pulls}")"
          head_repo="$(jq -r '.[0].head.repo.full_name' <<< "${pulls}")"
          head_branch="$(jq -r '.[0].head.ref' <<< "${pulls}")"
          head_sha="$(jq -r '.[0].head.sha' <<< "${pulls}")"
          base_branch="$(jq -r '.[0].base.ref' <<< "${pulls}")"
          draft="$(jq -r '.[0].draft' <<< "${pulls}")"

          [[ "${head_repo}" == "${GH_REPO}" ]] || {
            echo "PR #${pr_number} comes from unexpected repository ${head_repo}." >&2
            exit 1
          }
          [[ "${head_branch}" == "${EXPECTED_BRANCH}" ]] || {
            echo "PR #${pr_number} comes from unexpected branch ${head_branch}." >&2
            exit 1
          }
          [[ "${base_branch}" == "main" ]] || {
            echo "PR #${pr_number} targets unexpected branch ${base_branch}." >&2
            exit 1
          }
          [[ "${head_sha}" == "${EXPECTED_HEAD_SHA}" ]] || {
            echo "PR #${pr_number} changed after its successful test run." >&2
            exit 1
          }
          [[ "${draft}" == "false" ]] || {
            echo "PR #${pr_number} is still a draft." >&2
            exit 1
          }

          current_main_sha="$(gh api "repos/${GH_REPO}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "${EXPECTED_BASE_SHA}" != "${current_main_sha}" ]]; then
            echo "main changed after PR #${pr_number} started CI. Rebase and rerun CI before merging." >&2
            exit 1
          fi

          result="$(gh api --method PUT "repos/${GH_REPO}/pulls/${pr_number}/merge" \
            -f "sha=${EXPECTED_HEAD_SHA}" \
            -f merge_method=squash)"
          if [[ "$(jq -r '.merged' <<< "${result}")" != "true" ]]; then
            jq -r '.message' <<< "${result}" >&2
            exit 1
          fi
          echo "merged=true" >> "${GITHUB_OUTPUT}"

          {
            echo "## Dependency updates"
            echo "Squash-merged PR #${pr_number} after **Test Nix Flake** succeeded at \`${EXPECTED_HEAD_SHA}\`."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Build trusted main and populate the package cache
        if: steps.merge.outputs.merged == 'true'
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        # Merging with GITHUB_TOKEN does not trigger the push workflow.
        run: gh workflow run nix.yml --ref main
